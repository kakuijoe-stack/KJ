name: Deploy to GitHub Pages

# Deployment is handled by Vercel (see vercel.json). This workflow is kept for
# the option of publishing to GitHub Pages instead, and runs only on demand.
# Pages requires the branch to be allowed in the github-pages environment,
# since the repository default branch is a different branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
