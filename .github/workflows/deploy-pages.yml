name: Deploy to GitHub Pages

# Requires this branch to be allowed in the github-pages environment, since the
# repository default branch is a different branch. vercel.json is also present
# if Vercel is preferred instead.
on:
  push:
    branches: [claude/alvella-recruitment-homepage-ugxv0g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
